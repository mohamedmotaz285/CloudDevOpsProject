name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mohamedmotaz350/finalapplication
  K8S_MANIFEST_DIR: k8s
  K8S_DEPLOYMENT_FILE: deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Scan Image using Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push $IMAGE_NAME:latest

      - name: Delete local image
        run: docker rmi $IMAGE_NAME:latest

      - name: Update Manifests
        run: |
          sed -i "s|image: .*|image: $IMAGE_NAME:latest|g" $K8S_MANIFEST_DIR/$K8S_DEPLOYMENT_FILE


      - name: Commit and push deployment update
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          message: "Update image to ${{ env.IMAGE_NAME }}:latest [skip ci]"
          add: ${{ env.K8S_MANIFEST_DIR }}/${{ env.K8S_DEPLOYMENT_FILE }}
          push: true


      - name: Send Telegram Notification
        if: ${{ success() }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "🎉 Workflow Succeeded!"

