name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mohamedmotaz350/finalapplication
  K8S_MANIFEST_DIR: k8s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout Repository
        uses: actions/checkout@v3

 
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

    
      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME:latest .

      
      - name: Scan Image using Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest

     
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push $IMAGE_NAME:latest

      
      - name: Delete local image
        run: docker rmi $IMAGE_NAME:latest

    
      - name: Update Manifests
        run: |
          sed -i "s|image: .*|image: $IMAGE_NAME:latest|g" $K8S_MANIFEST_DIR/deployment.yaml

     
      - name: Commit and Push Updated Manifests
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add $K8S_MANIFEST_DIR/deployment.yaml
          git commit -m "Update manifests with latest image" || echo "No changes to commit"
          git push https://$GH_PAT@github.com/mohamedmotaz285/CloudDevOpsProject.git HEAD:main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          K8S_MANIFEST_DIR: k8s
       
