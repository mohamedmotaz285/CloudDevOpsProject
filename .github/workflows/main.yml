name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: mohamedmotaz350/finalapplication
  K8S_MANIFEST_DIR: k8s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: docker build -t $IMAGE_NAME:latest .

    - name: Scan Image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: $IMAGE_NAME:latest

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      run: docker push $IMAGE_NAME:latest

    - name: Delete Local Docker Image
      run: docker rmi $IMAGE_NAME:latest

    - name: Update Kubernetes Manifests
      run: |
        sed -i "s|image:.*|image: $IMAGE_NAME:latest|" $K8S_MANIFEST_DIR/deployment.yaml

    - name: Commit and Push Updated Manifests
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add $K8S_MANIFEST_DIR/deployment.yaml
        git commit -m "Update manifests with latest image"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
